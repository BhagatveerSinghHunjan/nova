services:
  postgres:
    image: postgres:16-alpine
    container_name: nova-lab-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nova_lab
    volumes:
      - nova_lab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nova_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nova_lab_pgdata:
    name: nova_lab_pgdata
